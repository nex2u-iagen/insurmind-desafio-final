line-length = 120
target-version = "py311"
extend-exclude = ["Projeto_Final_Artefatos", "dist", ".venv"]

[lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "BLE"]
ignore = [
  # BLE001 é aceitável quando o catch registra log de diagnóstico (ver ingest.py/ocr.py/app.py)
  "SIM105",
]

[lint.per-file-ignores]
# Script gerador de corpus: strings longas de texto de apólice não devem ser quebradas.
"scripts/create_policy_pdfs.py" = ["E501"]

[format]
quote-style = "double"
